<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Audio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&display=swap" rel="stylesheet">
<style>
  body { margin: 0 auto; max-width: 860px; padding: 48px 24px; background: #131416; color: #e6e6e6; font: 15px/1.5 system-ui, sans-serif; }
  h1, h2 { font-family: 'Faculty Glyphic', serif; font-weight: 400; }
  h1 { font-size: 40px; margin: 0 0 4px; } h2 { font-size: 24px; margin: 40px 0 8px; text-transform: capitalize; }
  p { color: #9a9ca1; margin: 0; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 14px 0; border-top: 1px solid #26282c; display: grid; grid-template-columns: 1fr 300px; gap: 6px 16px; align-items: center; }
  .name { font-size: 16px; } audio { width: 300px; height: 36px; }
  .url { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; }
  code { color: #8fb3d9; font-size: 12.5px; overflow-wrap: anywhere; }
  button { background: #26282c; color: #e6e6e6; border: 1px solid #3a3d42; border-radius: 4px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  button.done { color: #9fd49a; border-color: #4d7a49; }
  @media (max-width: 640px) { li { grid-template-columns: 1fr; } audio { width: 100%; } }
</style></head>
<body>
  <h1>Table Audio</h1>
  <p>Music and drones for the table. Copy a link into the Owlbear audio player.</p>
  <h2>No tracks yet</h2>
<script>
  document.addEventListener('click', e => {
    const b = e.target.closest('button[data-url]'); if (!b) return;
    navigator.clipboard.writeText(b.dataset.url).then(() => { b.textContent = 'Copied'; b.classList.add('done');
      setTimeout(() => { b.textContent = 'Copy'; b.classList.remove('done'); }, 1500); });
  });
</script>
</body></html>
